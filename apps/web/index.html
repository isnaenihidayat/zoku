<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoku</title>
    <link rel="icon" type="image/png" href="/zoku-logo-dither.png" />
    <script>
      (function () {
        var stored = localStorage.getItem("zoku-theme");
        var resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        if (stored === "light" || stored === "dark") {
          resolved = stored;
        } else if (stored === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved;
        var favicon = document.querySelector('link[rel="icon"]');
        if (favicon) {
          favicon.setAttribute(
            "href",
            resolved === "light"
              ? "/zoku-logo-dither-light.png"
              : "/zoku-logo-dither.png",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
